[package]
name = "inventory-http-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "inventory-http-server"
path = "src/main.rs"

[dependencies]
inventory-service = { path = ".." }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
