# Agent Substrate v0.6.0 & google/ax Hardened Deployment Overlay (ADR-0006, ADR-0007, ADR-0008)
---
apiVersion: v1
kind: Namespace
metadata:
  name: ax-system
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ax-bug-bash
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    ate.dev/api-access: "true"
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: ax-bug-bash-workers
  namespace: ax-bug-bash
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    workload: ax-bug-bash
  annotations:
    ax.dev/worker-runtime: "ateworker-gvisor"
    ax.dev/snapshot-fidelity: "SNAPSHOT_FIDELITY_VOLUMES"
spec:
  replicas: 4
  workerImage: ${ATEWORKER_GVISOR_IMAGE}
  sandboxClasses:
    - name: gvisor
      configRef:
        name: gvisor-default
  template:
    labels:
      app.kubernetes.io/part-of: ax-bug-bash
      workload: ax-bug-bash
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
---
# Declarative kubectl-ate & google/ax Control-Plane Specs (applied via kubectl-ate in hack/deploy-gke.sh)
apiVersion: v1
kind: ConfigMap
metadata:
  name: ax-ate-declarative-resources
  namespace: ax-system
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
data:
  access-policies.yaml: |
    apiVersion: ate.dev/v1alpha1
    kind: AccessPolicy
    metadata:
      name: ax-server-global-owner
    spec:
      bindings:
        - role: owner
          members:
            - user:system:serviceaccount:ax-system:ax-server
        - role: viewer
          members:
            - user:system:serviceaccount:ax-bug-bash:ax-observer
  ax-workspace-and-models.yaml: |
    apiVersion: ax.dev/v1alpha1
    kind: Workspace
    metadata:
      name: storefront-monorepo
      namespace: ax-bug-bash
    spec:
      git:
        repoUrl: http://storefront.ax-bug-bash.svc.cluster.local:3001/git/storefront.git
        defaultBranch: main
      persistence:
        stateDir: /workspace/.ax-state
        snapshotFidelity: SNAPSHOT_FIDELITY_VOLUMES
    ---
    apiVersion: ax.dev/v1alpha1
    kind: Model
    metadata:
      name: gemini-flash-cascade
      namespace: ax-bug-bash
    spec:
      provider: google-genai-gateway
      endpoint: http://model-gateway.ax-system.svc.cluster.local:8080
      defaultModel: gemini-3.8-flash
      fallbackCascade:
        - gemini-3.8-flash
        - gemini-3.7-flash
        - gemini-3.6-flash
        - gemini-3.5-flash
