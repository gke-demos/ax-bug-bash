apiVersion: v1
kind: Namespace
metadata:
  name: ax-system
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    ate.dev/api-access: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: ax-bug-bash
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    ate.dev/api-access: "true"
---
# ADR-0006 Mitigation #1 (google/ax Issue #511):
# Grant serviceaccount:ax-system:ax-server admin permissions on Namespace/default and Namespace/ax-bug-bash
# in Agent Substrate v0.6.0 OpenFGA authorization store so CreateTask/ResumeTask/SuspendTask succeed.
apiVersion: ate.dev/v1alpha1
kind: AccessPolicy
metadata:
  name: ax-server-default-namespace-admin
  namespace: default
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    ax.dev/hardening-issue: "511"
spec:
  targetRef:
    apiVersion: v1
    kind: Namespace
    name: default
  bindings:
    - role: admin
      subjects:
        - user:system:serviceaccount:ax-system:ax-server
        - user:system:serviceaccount:ax-bug-bash:ax-observer
---
apiVersion: ate.dev/v1alpha1
kind: AccessPolicy
metadata:
  name: ax-server-bug-bash-namespace-admin
  namespace: ax-bug-bash
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    ax.dev/hardening-issue: "511"
spec:
  targetRef:
    apiVersion: v1
    kind: Namespace
    name: ax-bug-bash
  bindings:
    - role: admin
      subjects:
        - user:system:serviceaccount:ax-system:ax-server
        - user:system:serviceaccount:ax-bug-bash:ax-observer
---
# Agent Substrate v0.6.0 Warm gVisor WorkerPool (4 ateworker-gvisor sandboxes with SNAPSHOT_FIDELITY_VOLUMES)
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: ax-bug-bash-workers
  namespace: ax-bug-bash
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    workload: ax-bug-bash
    ate.dev/worker-pool: ax-bug-bash-workers
spec:
  replicas: 4
  runtimeImage: gcr.io/agent-substrate/ateworker-gvisor:v0.6.0
  sandboxClasses:
    - name: gvisor
      configRef:
        name: gvisor-default
  snapshotConfig:
    preferredFidelity: SNAPSHOT_FIDELITY_VOLUMES
    volumeStateSubPath: .ax-state
  resources:
    cpuMillicores: 4000
    memoryBytes: 8589934592
---
# ADR-0006 Mitigation #3 (google/ax Issue #482):
# Declarative ax.v1alpha1 Workspace pointing at the in-cluster Storefront Git HTTP service
# so workspace setup completes in < 500ms before /readyz WakeupProbe evaluation.
apiVersion: ax.v1alpha1
kind: Workspace
metadata:
  name: storefront-monorepo
  atespace: default
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
    ax.dev/hardening-issue: "482"
spec:
  git:
    - name: storefront
      repo: http://storefront.ax-bug-bash.svc.cluster.local:3001/git/storefront.git
      branch: main
      dir: .
  env:
    - name: AX_STATE_DIR
      value: /workspace/.ax-state
---
# ADR-0007 Declarative ax.v1alpha1 Model pointing at the zero-secret in-cluster Model Gateway
# with ordered fallback cascade: gemini-3.8-flash -> gemini-3.7-flash -> gemini-3.6-flash -> gemini-3.5-flash.
apiVersion: ax.v1alpha1
kind: Model
metadata:
  name: gemini-flash-cascade
  atespace: default
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  provider: google
  model: gemini-3.8-flash
  endpoint: http://model-gateway.ax-system.svc.cluster.local:8080
  fallbackCascade:
    - gemini-3.8-flash
    - gemini-3.7-flash
    - gemini-3.6-flash
    - gemini-3.5-flash
