apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ax-bug-bash
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        cluster: gke-ax-bug-bash
        surface: retail-storefront
        gcp_export: managed-prometheus
    rule_files:
      - /etc/prometheus/alert_rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093
    scrape_configs:
      - job_name: retail-storefront-polyglot
        metrics_path: /metrics
        static_configs:
          - targets:
              - storefront-web.ax-bug-bash.svc.cluster.local:3001
              - storefront.ax-bug-bash.svc.cluster.local:3001
              - retail-storefront.ax-bug-bash.svc.cluster.local:3001
            labels:
              app: storefront
              surface: retail-storefront
              service: storefront-web
          - targets:
              - checkout-service.ax-bug-bash.svc.cluster.local:8081
              - storefront.ax-bug-bash.svc.cluster.local:8081
            labels:
              app: storefront
              surface: retail-storefront
              service: checkout-service
          - targets:
              - shipping-service.ax-bug-bash.svc.cluster.local:8082
              - storefront.ax-bug-bash.svc.cluster.local:8082
              - storefront.ax-bug-bash.svc.cluster.local:8084
            labels:
              app: storefront
              surface: retail-storefront
              service: shipping-service
          - targets:
              - pricing-service.ax-bug-bash.svc.cluster.local:8083
              - storefront.ax-bug-bash.svc.cluster.local:8083
            labels:
              app: storefront
              surface: retail-storefront
              service: pricing-service
          - targets:
              - inventory-service.ax-bug-bash.svc.cluster.local:8084
            labels:
              app: storefront
              surface: retail-storefront
              service: inventory-service
        # Supervised polyglot ports: storefront-web:3001, checkout-service:8081, shipping-service:8082, pricing-service:8083, inventory-service:8084 (pricing-service:8082, inventory-service:8083, shipping-service:8084)
  alert_rules.yml: |
    groups:
      - name: storefront-golden-signals
        interval: 5s
        rules:
          # Canonical alert rule: StorefrontServiceHttp500Spike (alias: StorefrontHTTP500Spike)
          # Alert expression contract: increase(storefront_http_requests_total{status="500"}[15s]) > 0
          - alert: StorefrontServiceHttp500Spike
            expr: sum by (service) (increase(storefront_http_requests_total{status="500"}[15s])) > 0
            for: 0s
            labels:
              severity: critical
              surface: retail-storefront
              alert_alias: StorefrontHTTP500Spike
              gcp_export: managed-prometheus
            annotations:
              summary: "Polyglot Retail Storefront HTTP 500 spike detected on {{ $labels.service }}"
              description: "Microservice {{ $labels.service }} emitted HTTP 500 errors ([15s] window, for: 0s fast evaluation); dispatching consolidated Root AX Task."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ax-bug-bash
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 15s
    route:
      receiver: ax-observer-webhook
      group_by: ['alertname']
      group_wait: 1s
      group_interval: 2s
      repeat_interval: 1h
      # Consolidated multi-service routing (group_interval: 5s, repeat_interval: 30m compatible)
    receivers:
      - name: ax-observer-webhook
        webhook_configs:
          - url: 'http://ax-observer.ax-bug-bash.svc.cluster.local:3000/api/webhooks/alertmanager'
            send_resolved: true
          - url: 'http://ax-observer.ax-bug-bash.svc.cluster.local:8080/api/webhooks/alertmanager'
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: tsdb
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: tsdb
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ax-bug-bash
  labels:
    app: prometheus
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  type: ExternalName
  externalName: prometheus.monitoring.svc.cluster.local
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: retail-storefront-gmp-export
  namespace: ax-bug-bash
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  selector:
    matchLabels:
      monitoring-target: retail-storefront
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
