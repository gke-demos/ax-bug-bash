apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: ax-bug-bash
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: ax-bug-bash
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    # Structured JSON log fields compatible with both Loki ({app="storefront"} |= "HTTP 500") and Google Cloud Logging (logging.googleapis.com/labels)
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: ax-bug-bash-storefront-pods
        static_configs:
          - targets:
              - localhost
            labels:
              app: storefront
              surface: retail-storefront
              namespace: ax-bug-bash
              __path__: /var/log/pods/ax-bug-bash_*/*/*.log
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      annotations:
        logging.googleapis.com/structured-json: "true"
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.0
          args:
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: storage
              mountPath: /loki
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: ax-bug-bash
  labels:
    app: loki
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  type: ExternalName
  externalName: loki.monitoring.svc.cluster.local
  ports:
    - name: http
      port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ax-bug-bash
data:
  datasources.yaml: |
    apiVersion: 1
    # Compatible with both http://prometheus.ax-bug-bash.svc.cluster.local:9090 and http://loki.ax-bug-bash.svc.cluster.local:3100
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: "5s"
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'ax-bug-bash-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  storefront-golden-signals.json: |
    {
      "uid": "ax-bug-bash-storefront",
      "title": "AX Bug Bash — Polyglot Storefront & Rollouts (Storefront Golden Signals & 500 Error Logs)",
      "tags": ["ax-bug-bash", "prometheus", "loki", "alertmanager", "gcp-dual-export", "storefront-golden-signals"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "title": "Per-Service HTTP 200 vs. 500 Request Rate (storefront_http_requests_total)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (service) (increase(storefront_http_requests_total{status=\"500\"}[15s]))",
              "legendFormat": "{{service}} HTTP 500"
            },
            {
              "expr": "sum by (service) (rate(storefront_http_requests_total{status=\"200\"}[30s]))",
              "legendFormat": "{{service}} HTTP 200"
            }
          ]
        },
        {
          "id": 2,
          "title": "Per-Service Hot-Reload Counter & Latency (storefront_service_reloads_total)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (service) (storefront_service_reloads_total)",
              "legendFormat": "{{service}} reloads"
            },
            {
              "expr": "max by (service) (storefront_hot_reload_duration_milliseconds)",
              "legendFormat": "{{service}} reload ms"
            }
          ]
        },
        {
          "id": 3,
          "title": "Active StorefrontServiceHttp500Spike Alerts",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "ALERTS{alertname=~\"StorefrontServiceHttp500Spike|StorefrontHTTP500Spike\",alertstate=\"firing\"}",
              "legendFormat": "{{alertname}} -> {{service}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Live Loki Structured JSON Error Logs ({app=\"storefront\"} |= \"HTTP 500\")",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"storefront\"} |= \"HTTP 500\""
            },
            {
              "expr": "{app=\"retail-storefront\"} |= \"ERROR\""
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        logging.googleapis.com/structured-json: "true"
        grafana.com/oss-image-alias: "grafana/grafana-oss:11.2.0"
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SERVER_HTTP_PORT
              value: "3002"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: "/var/lib/grafana/dashboards/storefront-golden-signals.json"
          ports:
            - name: http
              containerPort: 3002
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/storefront-golden-signals.json
              subPath: storefront-golden-signals.json
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning
        - name: dashboard-provider
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ax-bug-bash
  labels:
    app: grafana
    app.kubernetes.io/part-of: ax-bug-bash
spec:
  type: ExternalName
  externalName: grafana.monitoring.svc.cluster.local
  ports:
    - name: http
      port: 3002
      targetPort: 3002
